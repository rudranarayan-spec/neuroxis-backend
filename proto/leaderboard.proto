syntax = "proto3";

package neuroxis.v1;

service LeaderboardService {
  rpc GetLeaderboard (GetLeaderboardRequest) returns (GetLeaderboardResponse);
  rpc GetMyRank (GetMyRankRequest) returns (GetMyRankResponse);
}

message GetLeaderboardRequest {
  string type = 1;   // "global", "region", "district"
  string filter = 2; // Specific region or district name (e.g. "ASIA", "EU")
  int32 page = 3;
  int32 limit = 4;
}

message LeaderboardEntry {
  int32 rank = 1;
  string user_id = 2;
  string username = 3;
  string region = 4;
  string district = 5;
  int32 level = 6;
  int32 streak = 7;
  int32 elo = 8;
}

message GetLeaderboardResponse {
  bool success = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_count = 4;
  repeated LeaderboardEntry entries = 5;
  string error = 6;
}

message GetMyRankRequest {
  string type = 1;   // "global", "region", "district"
  string filter = 2;
}

message GetMyRankResponse {
  bool success = 1;
  int32 rank = 2;
  int32 elo = 3;
  string error = 4;
}